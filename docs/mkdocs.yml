site_name: MagfaSMS Docs
site_description: Official MagfaSMS Package documentation
site_url: https://magfasms.amirhossein.info

repo_url: https://github.com/BlackIQ/magfa-sdk
repo_name: BlackIQ/magfa-sdk

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - search.suggest

nav:
  - Home: index.md
  - Learn:
    - Install: learn/install.md
    - Usage: learn/usage.md

markdown_extensions:
  - tables
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true